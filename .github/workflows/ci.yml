name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI
        run: |
          cd cli
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd cli
          pytest -v

      - name: Verify CLI runs
        run: |
          inferency --version
          inferency scan examples/python --json-output

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd extensions/vscode
          npm install

      - name: Compile
        run: |
          cd extensions/vscode
          npm run compile
